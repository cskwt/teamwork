[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "fontconfig"]

[phases.install]
cmds = [
  "python3 -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip",
  ". /opt/venv/bin/activate && pip install -r requirements.txt",
]

[phases.build]
cmds = [
  "python3 -c \"import reportlab; import PIL; import arabic_reshaper; import bidi\"",
  "test -f Fonts/Tahoma.ttf || (echo 'MISSING: Fonts/Tahoma.ttf' && exit 1)",
]

[start]
cmd = "python3 run_tools.py"
